name: Service Task
description: Track concrete implementation work in a service or repository.
title: "[task] "
labels: ["needs:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for concrete implementation work owned mainly by one repository or service.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What needs to be changed or implemented?
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Capture the intended implementation direction if known.
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link related contracts, ADRs, parent issues, or service dependencies.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] 
        - [ ] 
    validations:
      required: true