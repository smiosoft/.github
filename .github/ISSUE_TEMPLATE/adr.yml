name: Architecture Decision
description: Capture an architecture decision, options, trade-offs, and consequences.
title: "[adr] "
labels: ["type:adr", "needs:decision"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for meaningful architecture decisions. The goal is to record the decision and its consequences, not to write a long essay.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem, pressure, or decision point are we facing?
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: Proposed decision
      description: What decision is being proposed or recorded?
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options considered
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: consequences
    attributes:
      label: Consequences
      description: What are the trade-offs, risks, benefits, and follow-up implications?
    validations:
      required: true

  - type: textarea
    id: follow-up
    attributes:
      label: Follow-up work
      placeholder: |
        - [ ] 
        - [ ] 
    validations:
      required: false