name: Contract
description: Define or change an event, API, schema, projection, gateway route, webhook, or consumer expectation.
title: "[contract] "
labels: ["type:contract", "needs:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when a service boundary or integration agreement is being defined or changed.

  - type: textarea
    id: contract
    attributes:
      label: Contract
      description: What contract is being created or changed?
      placeholder: Event name, API endpoint, schema, projection, gateway route, webhook, or consumer expectation.
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: What business or platform fact does this contract represent?
    validations:
      required: true

  - type: textarea
    id: producers-consumers
    attributes:
      label: Producers / consumers
      description: Which services produce, expose, consume, or depend on this contract?
      placeholder: |
        Producer/exposer:
        Consumers/dependants:
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: Shape
      description: Payload, request/response, schema, route, or example.
      render: json
    validations:
      required: false

  - type: textarea
    id: semantics
    attributes:
      label: Semantics and compatibility
      description: Versioning, ordering, replay, idempotency, backwards compatibility, deletion behaviour, or breaking-change concerns.
      placeholder: |
        Versioning:
        Ordering:
        Replay:
        Idempotency:
        Compatibility:
        Deletion/disable behaviour:
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Contract is documented
        - [ ] Producer/exposer behaviour is clear
        - [ ] Consumer expectations are clear
        - [ ] Compatibility impact is understood
    validations:
      required: true