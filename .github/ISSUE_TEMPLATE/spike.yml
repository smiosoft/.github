name: Spike
description: Time-boxed research or investigation that should produce a decision or recommendation.
title: "[spike] "
labels: ["type:spike", "needs:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when the work is unclear and discovery is needed before implementation.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What question are we trying to answer?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why does this need investigation?
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Timebox, technical constraints, business constraints, or known boundaries.
    validations:
      required: false

  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: What should this spike produce?
      placeholder: Decision, ADR, prototype, recommendation, follow-up issues, or rejected option.
    validations:
      required: true